naftiko: 1.0.0-alpha2
info:
  label: FatSecret Platform API — Exercise Diary
  description: 'FatSecret Platform API — Exercise Diary. 2 operations. Lead operation: Get exercise diary entries. Self-contained
    Naftiko capability covering one Fatsecret business surface.'
  tags:
  - Fatsecret
  - Exercise Diary
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FATSECRET_API_KEY: FATSECRET_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-exercise-diary
    baseUri: https://platform.fatsecret.com/rest
    description: FatSecret Platform API — Exercise Diary business capability. Self-contained, no shared references.
    resources:
    - name: exercise-entries-v2
      path: /exercise-entries/v2
      operations:
      - name: getexerciseentries
        method: GET
        description: Get exercise diary entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: commitexerciseentries
        method: POST
        description: Commit exercise diary entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.FATSECRET_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-exercise-diary-rest
    port: 8080
    description: REST adapter for FatSecret Platform API — Exercise Diary. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/exercise-entries/v2
      name: exercise-entries-v2
      description: REST surface for exercise-entries-v2.
      operations:
      - method: GET
        name: getexerciseentries
        description: Get exercise diary entries
        call: platform-exercise-diary.getexerciseentries
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: commitexerciseentries
        description: Commit exercise diary entries
        call: platform-exercise-diary.commitexerciseentries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-exercise-diary-mcp
    port: 9090
    transport: http
    description: MCP adapter for FatSecret Platform API — Exercise Diary. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-exercise-diary-entries
      description: Get exercise diary entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-exercise-diary.getexerciseentries
      outputParameters:
      - type: object
        mapping: $.
    - name: commit-exercise-diary-entries
      description: Commit exercise diary entries
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-exercise-diary.commitexerciseentries
      outputParameters:
      - type: object
        mapping: $.
