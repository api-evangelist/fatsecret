naftiko: 1.0.0-alpha2
info:
  label: FatSecret Platform API — Food Diary
  description: 'FatSecret Platform API — Food Diary. 3 operations. Lead operation: Monthly food diary summary. Self-contained
    Naftiko capability covering one Fatsecret business surface.'
  tags:
  - Fatsecret
  - Food Diary
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FATSECRET_API_KEY: FATSECRET_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-food-diary
    baseUri: https://platform.fatsecret.com/rest
    description: FatSecret Platform API — Food Diary business capability. Self-contained, no shared references.
    resources:
    - name: food-entries-month-v2
      path: /food-entries/month/v2
      operations:
      - name: getfoodentriesmonth
        method: GET
        description: Monthly food diary summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: month
          in: query
          type: string
    - name: food-entries-v2
      path: /food-entries/v2
      operations:
      - name: getfoodentries
        method: GET
        description: Get food diary entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: date
          in: query
          type: string
      - name: createfoodentry
        method: POST
        description: Create food diary entry
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.FATSECRET_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-food-diary-rest
    port: 8080
    description: REST adapter for FatSecret Platform API — Food Diary. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/food-entries/month/v2
      name: food-entries-month-v2
      description: REST surface for food-entries-month-v2.
      operations:
      - method: GET
        name: getfoodentriesmonth
        description: Monthly food diary summary
        call: platform-food-diary.getfoodentriesmonth
        with:
          month: rest.month
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/food-entries/v2
      name: food-entries-v2
      description: REST surface for food-entries-v2.
      operations:
      - method: GET
        name: getfoodentries
        description: Get food diary entries
        call: platform-food-diary.getfoodentries
        with:
          date: rest.date
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createfoodentry
        description: Create food diary entry
        call: platform-food-diary.createfoodentry
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-food-diary-mcp
    port: 9090
    transport: http
    description: MCP adapter for FatSecret Platform API — Food Diary. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: monthly-food-diary-summary
      description: Monthly food diary summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-food-diary.getfoodentriesmonth
      with:
        month: tools.month
      outputParameters:
      - type: object
        mapping: $.
    - name: get-food-diary-entries
      description: Get food diary entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-food-diary.getfoodentries
      with:
        date: tools.date
      outputParameters:
      - type: object
        mapping: $.
    - name: create-food-diary-entry
      description: Create food diary entry
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-food-diary.createfoodentry
      outputParameters:
      - type: object
        mapping: $.
