aid: fatsecret
name: FatSecret
description: >-
  FatSecret is a global nutrition and wellness platform whose Platform API exposes a verified database of more than 1.9
  million foods across 56 countries, plus recipes, exercises, and user-scoped food diary, exercise diary, and weight
  tracking. The API is used by more than 35,000 developers and serves over 700 million calls per month.
